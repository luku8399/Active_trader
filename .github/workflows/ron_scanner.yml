name: Run Ron Scanner

on:
  schedule:
    # 09:20 AM IST (Monday to Friday) = 03:50 AM UTC
    - cron: '50 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytz numpy

      - name: Execute Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RADAR_BOT_TOKEN: ${{ secrets.TELEGRAM_RADAR_BOT_TOKEN }}
        run: |
          python -u ron_scanner.py
